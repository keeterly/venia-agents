<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainstorm</title>
<meta name="description" content="Capture, plan and mind-map — the Brainstorm side of VENIA OS.">
<meta name="theme-color" content="#0a0a0a">
<!-- Standalone home-screen app identity (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brainstorm">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/brainstorm.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;color:#fff;
    font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .mark{font-size:26px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
  .sub{font-size:12px;color:#9a9a9a;letter-spacing:.5px}
  .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:p 1s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">✎ Brainstorm</div>
    <div class="sub"><span class="dot"></span>&nbsp;opening your VENIA brain…</div>
  </div>
  <script>
    // Standalone Brainstorm entry point. It boots the full VENIA OS app (same
    // code, same Supabase-synced data) straight into the Brain Dump via the
    // ?app=brainstorm flag — so this installs as its own home-screen icon but
    // shares one brain with VENIA OS.
    location.replace('/?app=brainstorm');
  </script>
</body>
</html>
