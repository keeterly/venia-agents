# Netlify configuration — static deploy of the VENIA control panel.
# No build step: the app is a single self-contained HTML file at the repo root.

[build]
  publish = "."
  command = ""

# Serverless functions (e.g. the Claude proxy that keeps the API key off the client).
# esbuild bundles npm deps (web-push) into the functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve the control panel at the site root (the file keeps its versioned name).
# The redirect excludes /.netlify/* so function calls are not rewritten.
[[redirects]]
  from = "/"
  to = "/venia-control-panel-v1.html"
  status = 200

# Standalone Brainstorm entry at a clean URL. A 200 rewrite (not a 301) serves
# the file directly, so there's no .html pretty-URL redirect for the service
# worker or iOS to choke on. Both /brainstorm and /brainstorm.html resolve.
[[redirects]]
  from = "/brainstorm"
  to = "/brainstorm.html"
  status = 200

# Sensible security headers for a private internal tool.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The app shell, the root, and the service worker must NEVER sit in an HTTP
# cache — always revalidate against the server so a fresh deploy propagates
# immediately. Without this the browser's own cache can pin an old build even
# after the service worker moves on, which is exactly how a device gets stuck
# on a previous Build number. (The SW's runtime cache is separate and unaffected.)
[[headers]]
  for = "/venia-control-panel-v1.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
