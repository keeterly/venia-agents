# Netlify configuration — static deploy of the VENIA control panel.
# No build step: the app is a single self-contained HTML file at the repo root.

[build]
  publish = "."
  command = ""

# Serverless functions (e.g. the Claude proxy that keeps the API key off the client).
# esbuild bundles npm deps (web-push) into the functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve the control panel at the site root (the file keeps its versioned name).
# The redirect excludes /.netlify/* so function calls are not rewritten.
[[redirects]]
  from = "/"
  to = "/venia-control-panel-v1.html"
  status = 200

# Standalone Brainstorm entry at a clean URL. A 200 rewrite (not a 301) serves
# the file directly, so there's no .html pretty-URL redirect for the service
# worker or iOS to choke on. Both /brainstorm and /brainstorm.html resolve.
[[redirects]]
  from = "/brainstorm"
  to = "/brainstorm.html"
  status = 200

# Boards (Build 612): Brainstorm's creative space, a self-contained module
# with its own compiled app in modules/boards/dist. VENIA OS hosts it in a
# frame; it also opens on its own here.
[[redirects]]
  from = "/boards"
  to = "/modules/boards/dist/index.html"
  status = 200

# Pattern CAD (Build 634): VENIA's pattern drafting CAD, built in its own
# repository and brought in as modules/pattern-cad. VENIA OS hosts it in a
# frame from Product; it also opens on its own here.
[[redirects]]
  from = "/pattern-cad"
  to = "/modules/pattern-cad/dist/index.html"
  status = 200

# Dr4ft is the pattern CAD's name since Build 635; both addresses open it.
[[redirects]]
  from = "/dr4ft"
  to = "/modules/pattern-cad/dist/index.html"
  status = 200

# Sensible security headers for a private internal tool.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The app shell, the root, and the service worker must NEVER sit in an HTTP
# cache — always revalidate against the server so a fresh deploy propagates
# immediately. Without this the browser's own cache can pin an old build even
# after the service worker moves on, which is exactly how a device gets stuck
# on a previous Build number. (The SW's runtime cache is separate and unaffected.)
[[headers]]
  for = "/venia-control-panel-v1.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# A module's entry page must revalidate like the shell, so a new build lands.
# Its hashed assets can cache normally.
[[headers]]
  for = "/modules/*/dist/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/boards"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/pattern-cad"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/dr4ft"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
