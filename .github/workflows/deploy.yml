name: Deploy to Netlify

# Auto-deploy the VENIA control panel to production on every push to main.
# The build (esbuild-bundling the netlify/functions) runs here on the GitHub
# runner and the result is uploaded straight to Netlify — so this does NOT
# consume Netlify build minutes, which is what stalled earlier auto-deploys.
#
# One-time setup: add a repo secret NETLIFY_AUTH_TOKEN
#   Netlify → user avatar → User settings → Applications → Personal access tokens
#   → New access token → copy it. Then in GitHub:
#   repo → Settings → Secrets and variables → Actions → New repository secret
#   → name: NETLIFY_AUTH_TOKEN, value: <the token>.
# The site id below is not secret (it is already in the client config).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys race; let an in-flight one finish (don't cancel a
# publish midway).
concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 2da50745-48db-4026-880f-54e484dee72f
        run: >-
          npx --yes netlify-cli@latest deploy
          --build
          --prod
          --site "$NETLIFY_SITE_ID"
          --message "GitHub Actions · ${GITHUB_SHA::7}"
